; ── Polybar module for usage ───────────────────────────────────────────
;
;   Add this to ~/.config/polybar/config.ini (or wherever your bar lives):
;
;     [module/usage]
;     type = custom/script
;     exec = usage polybar
;     interval = 60
;     click-left = alacritty -e usage show
;     click-right = usage refresh
;     format-prefix = " "
;     format-foreground = #${colors.foreground}
;
;   Then put `usage` in your bar's `modules-right` (or wherever you
;   want it), restart polybar and enjoy.

[module/usage]
type          = custom/script
exec          = usage polybar
interval      = 60
click-left    = alacritty -e usage show
click-middle  = usage refresh
click-right   = usage check all
format-prefix = " "
format-foreground = #${colors.primary}
label         = %output%

; Standalone preview if you do not use a theme:
; [module/usage]
; type = custom/script
; exec = usage polybar
; interval = 60
; click-left = usage show
