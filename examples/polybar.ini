; ── Polybar module for plan-usage ────────────────────────────────────────────
;
;   Add this to ~/.config/polybar/config.ini (or wherever your bar lives):
;
;     [module/plan-usage]
;     type = custom/script
;     exec = plan-usage polybar
;     interval = 60
;     click-left = alacritty -e plan-usage show
;     click-right = plan-usage refresh
;     format-prefix = " "
;     format-foreground = #${colors.foreground}
;
;   Then put `usage` in your bar's `modules-right` (or wherever you
;   want it), restart polybar and enjoy.

[module/plan-usage]
type          = custom/script
exec          = plan-usage polybar
interval      = 60
click-left    = alacritty -e plan-usage show
click-middle  = plan-usage refresh
click-right   = plan-usage check all
format-prefix = " "
format-foreground = #${colors.primary}
label         = %output%

