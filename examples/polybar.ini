; ── Polybar module for provider-usage ───────────────────────────────────────────
;
;   Add this to ~/.config/polybar/config.ini (or wherever your bar lives):
;
;     [module/provider-usage]
;     type = custom/script
;     exec = provider-usage polybar
;     interval = 60
;     click-left = alacritty -e provider-usage show
;     click-right = provider-usage refresh
;     format-prefix = " "
;     format-foreground = #${colors.foreground}
;
;   Then put `usage` in your bar's `modules-right` (or wherever you
;   want it), restart polybar and enjoy.

[module/provider-usage]
type          = custom/script
exec          = provider-usage polybar
interval      = 60
click-left    = alacritty -e provider-usage show
click-middle  = provider-usage refresh
click-right   = provider-usage check all
format-prefix = " "
format-foreground = #${colors.primary}
label         = %output%

